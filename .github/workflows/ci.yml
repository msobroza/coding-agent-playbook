name: ci

# Runs the lint/type/test tools directly rather than through pre-commit, and
# installs with pip + first-party actions only (no third-party marketplace
# actions) so it runs in restricted/self-hosted GitHub environments too.
# pre-commit (.pre-commit-config.yaml) remains the local dev loop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest -q

      - name: playbook --version smoke test
        run: playbook --version

      - name: coding-agent-playbook --version smoke test
        run: coding-agent-playbook --version

      - name: playbook-hook --version smoke test
        run: playbook-hook --version

      # The engine repo has no hooks config of its own, so the step passes the
      # committed fixture config (tests/hook_runtime/test_simulate.py pins it to
      # the rendered destructive-command-guard): rm -rf / must exit 2 (deny).
      - name: playbook-hook simulate smoke test (rm -rf / is denied)
        run: |
          playbook-hook simulate pre_tool_use --format json \
            --config tests/fixtures/hook_guard_config/destructive.json \
            < tests/fixtures/hook_payloads/claude_code/pre_tool_use/bash_rm_root.json \
            > "$RUNNER_TEMP/simulate.json"
          cat "$RUNNER_TEMP/simulate.json"
          python -c "import json, os; r = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'simulate.json'))); assert r['exit_code'] == 2, r"

  # Dogfoods the commit convention (specs/prK-lifecycle-hooks.md §K OQ-6): only the
  # `commit-convention` step of `playbook ci` runs here, on pull requests. It checks
  # the commits after .coding-agent-playbook.toml's cutover_date against
  # [tool.commitizen], plus the PR title. The test matrix above stays the
  # authoritative CI-parity gate. commitizen is installed only in this job, so the
  # matrix's ".[dev]" install is unchanged.
  playbook-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # playbook ci diffs <merge base>..HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engine and commitizen
        run: python -m pip install -e . "commitizen>=3"

      # The PR title is attacker-controlled text: it reaches cz only through env:,
      # as one argv element, and is never interpolated into a run: line.
      - name: playbook ci (commit convention)
        run: playbook ci --steps commit-convention --base origin/main
        env:
          PLAYBOOK_PR_TITLE: ${{ github.event.pull_request.title }}

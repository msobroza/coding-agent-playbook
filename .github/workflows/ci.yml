name: ci

# Runs the lint/type/test tools directly rather than through pre-commit, and
# installs with pip + first-party actions only (no third-party marketplace
# actions) so it runs in restricted/self-hosted GitHub environments too.
# pre-commit (.pre-commit-config.yaml) remains the local dev loop.

on:
  push:
    branches: [main]
  # labeled lets the ci:full label start a run (ADR 0010). A trigger cannot
  # filter on the label's name, so any label starts one. The jobs do not skip
  # those runs on purpose: a skipped job reports success, so a skipped required
  # check would pass a pull request whose previous run failed.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The pull request's merge commit and its first parent: the lane step
      # below diffs the two (ADR 0010).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      # ADR 0010: a pull request whose changes are all skill content takes the
      # skill lane, and every other case (a push, the ci:full label, any other
      # path, a git error) the full lane. The event name and the label reach
      # the selector only through env:, never interpolated into run:.
      - name: Pick the test lane (ADR 0010)
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: echo "lane=$(python -m tests.skill_lane --event "$EVENT_NAME" --force-full "$FORCE_FULL")" >> "$GITHUB_OUTPUT"

      # pytest-xdist spreads the suite over the runner's cores; pytest-cov
      # combines the workers' coverage data before fail-under is checked.
      # worksteal, not the default load: the slow end-to-end sync tests
      # (tests/cli/test_sync_*, seconds each) cluster at the end of the
      # collection, and with load one worker ran that whole tail alone while
      # the others sat idle (92% of the tests in 10 min, the rest in 46 min).
      # The skill lane runs only the catalog checks, without coverage: the 80%
      # floor holds for the whole suite only (ADR 0010). Any other lane value
      # runs the full suite, the empty one a crashed selector leaves included.
      - name: pytest
        env:
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          if [ "$LANE" = skill ]; then
            pytest -q -n auto --dist worksteal -m catalog --no-cov
          else
            pytest -q -n auto --dist worksteal
          fi

      - name: playbook --version smoke test
        run: playbook --version

      - name: coding-agent-playbook --version smoke test
        run: coding-agent-playbook --version

      - name: playbook-hook --version smoke test
        run: playbook-hook --version

      # The engine repo has no hooks config of its own, so the step passes the
      # committed fixture config (tests/hook_runtime/diagnostics/test_simulate.py
      # pins it to the rendered destructive-command-guard): rm -rf / must exit 2
      # (deny).
      - name: playbook-hook simulate smoke test (rm -rf / is denied)
        run: |
          playbook-hook simulate pre_tool_use --format json \
            --config tests/fixtures/hook_guard_config/destructive.json \
            < tests/fixtures/hook_payloads/claude_code/pre_tool_use/bash_rm_root.json \
            > "$RUNNER_TEMP/simulate.json"
          cat "$RUNNER_TEMP/simulate.json"
          python -c "import json, os; r = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'simulate.json'))); assert r['exit_code'] == 2, r"

  # Dogfoods the commit convention (specs/prK-lifecycle-hooks.md §K OQ-6): only the
  # `commit-convention` step of `playbook ci` runs here, on pull requests. It checks
  # the commits after .coding-agent-playbook.toml's cutover_date against
  # [tool.commitizen], plus the PR title. The test matrix above is the CI-parity
  # gate, and on a skill-only pull request it runs only its catalog checks (ADR
  # 0009). commitizen is installed only in this job, so the matrix's ".[dev]"
  # install is unchanged; its range is scripts/release.py's COMMITIZEN_REQUIREMENT.
  playbook-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # playbook ci diffs <merge base>..HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engine and commitizen
        run: python -m pip install -e . "commitizen>=4.13,<5"

      # The PR title is attacker-controlled text: it reaches cz only through env:,
      # as one argv element, and is never interpolated into a run: line.
      - name: playbook ci (commit convention)
        run: playbook ci --steps commit-convention --base origin/main
        env:
          PLAYBOOK_PR_TITLE: ${{ github.event.pull_request.title }}

  # Runs each core skill example's own tests (prU D48): an example under
  # catalog/core/skills/<skill>/examples/<app>/ is a runnable app with its own
  # pyproject.toml. uv builds a throwaway .venv inside the example from that
  # pyproject (its dependencies plus its default dev group), so the engine's
  # install, pyproject and lock gain nothing, and the `test` job never imports
  # example code (pytest's testpaths is tests/). UV_PYTHON picks the matrix
  # Python, which uv downloads when the runner lacks it.
  core-examples:
    runs-on: ubuntu-latest
    # Examples run in consumer repos from Python 3.10 on (prU D40, D48).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Test and type-check every core example in its own environment
        run: |
          set -euo pipefail
          mapfile -t examples < <(find catalog/core/skills -mindepth 4 -maxdepth 4 -path '*/examples/*/pyproject.toml' -printf '%h\n' | sort)
          if [ "${#examples[@]}" -eq 0 ]; then
            echo "no core skill ships an example yet"
            exit 0
          fi
          for example in "${examples[@]}"; do
            echo "::group::$example"
            uv run --directory "$example" pytest
            uv run --directory "$example" mypy
            echo "::endgroup::"
          done

  # Builds the wheel the way a release does (the sdist first, then a wheel from
  # it) and proves the installed wheel works outside the checkout. catalog/ ships
  # through a force-include, so a mis-scoped include or a tracked file the sdist
  # drops would otherwise go unnoticed: the editable install in `test` never
  # reads the packaged copy.
  wheel-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failing command piped into tee still fails the step
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist, then a wheel from it
        run: python -m pip install build && python -m build

      - name: The wheel's _catalog/ equals the tracked catalog/ tree
        run: |
          python -c '
          import glob, subprocess, sys, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          prefix = "coding_agent_playbook/_catalog/"
          names = zipfile.ZipFile(wheel).namelist()
          shipped = {n[len(prefix):] for n in names if n.startswith(prefix) and not n.endswith("/")}
          listed = subprocess.run(["git", "ls-files", "-z", "catalog"], capture_output=True, text=True, check=True).stdout
          tracked = {path[len("catalog/"):] for path in listed.split("\0") if path}
          if shipped != tracked:
              sys.exit(f"wheel-only: {sorted(shipped - tracked)}; tracked-only: {sorted(tracked - shipped)}")
          print(f"{len(shipped)} catalog files match git ls-files catalog")
          '

      - name: Install the wheel (non-editable) into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl
          echo "$RUNNER_TEMP/smoke-venv/bin" >> "$GITHUB_PATH"
          timeout 120 "$RUNNER_TEMP/smoke-venv/bin/playbook" --version </dev/null

      - name: init with the superpowers bundled plugin in an empty scratch git repo
        run: |
          mkdir "$RUNNER_TEMP/smoke-repo"
          cd "$RUNNER_TEMP/smoke-repo"
          # A git work tree: init turns lifecycle hooks on, and hooks are git-only,
          # so outside one sync warns and the no-warning check below would fail.
          git init -q
          timeout 120 playbook init --non-interactive --name smoke --kind python-library \
            --overlays coding_agent_playbook.plugins.superpowers \
            </dev/null 2>&1 | tee "$RUNNER_TEMP/init.log"
          if grep -n '^warning:' "$RUNNER_TEMP/init.log"; then
            echo "init printed a warning line" >&2
            exit 1
          fi
          for skill in brainstorming; do
            test -f ".claude/skills/$skill/SKILL.md" || { echo "missing .claude/skills/$skill/SKILL.md" >&2; exit 1; }
          done

      - name: eval --list finds the 35 core eval samples
        run: |
          cd "$RUNNER_TEMP/smoke-repo"
          timeout 120 playbook eval --list </dev/null | tee "$RUNNER_TEMP/eval-list.log"
          grep -Fw '35 eval samples' "$RUNNER_TEMP/eval-list.log"

      # The engine's hooks ship as catalog/core/hooks/ in the wheel's _catalog/:
      # the synced destructive-command-guard must deny rm -rf / (exit code 2).
      - name: playbook-hook simulate with the wheel's own hooks (rm -rf / is denied)
        run: |
          cd "$RUNNER_TEMP/smoke-repo"
          timeout 60 playbook-hook simulate pre_tool_use --format json \
            < "$GITHUB_WORKSPACE/tests/fixtures/hook_payloads/claude_code/pre_tool_use/bash_rm_root.json" \
            > "$RUNNER_TEMP/smoke-simulate.json"
          python -c "import json, os; r = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'smoke-simulate.json'))); assert r['exit_code'] == 2, r"

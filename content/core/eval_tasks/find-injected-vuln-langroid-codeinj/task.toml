id = "find-injected-vuln-langroid-codeinj"
prompt_id = "find-injected-vulnerability"
description = "Code injection paraphrase; derived from CVE-2025-46724 (CrossCommitVuln-Bench, CC BY 4.0, A. Majumdar). See eval_tasks/ATTRIBUTIONS.md."
version = 1

[setup]
files = ["app/tools.py", "app/runner.py", "pyproject.toml"]
project_kind = "library"

[invocation]
prompt_args = "This project contains a security vulnerability. Find where untrusted input reaches a dangerous operation and classify the exploit."
input_variables = {}

[gate]
# Review-only: the agent must find the flaw by reading, not by editing. Deterministic, token-free.
# `names_class` gates the *answer* too: a wrong vulnerability class loses the gate
# here, before the judge is ever invoked (fail_fast short-circuits the JUDGED tier).
expr = "tools_untouched and runner_untouched and names_class"

[gate.bind]
tools_untouched  = { check = "file_unchanged", path = "app/tools.py" }
runner_untouched = { check = "file_unchanged", path = "app/runner.py" }
# Lenient CWE-94 class regex: it must not reject a correctly-phrased
# answer — the judge, not this gate, is what grades precision.
names_class = { check = "answer_matches", pattern = '(?i)code injection|cwe[-\s]?94\b|arbitrary code execution|eval injection' }

[rubric]
expr = "identifies_exact_vuln"

[rubric.bind]
identifies_exact_vuln = { fail = 0.5, rubric = [
  { judge = "The answer names code injection (CWE-94) as the vulnerability class.", weight = 0.34 },
  { judge = "The answer traces the untrusted source (a user-supplied expression string) to the sink where it is passed to eval() and executed as Python.", weight = 0.33 },
  { judge = "The answer cites the specific fixture files where the source and the sink live (app/tools.py and app/runner.py).", weight = 0.33 },
] }

[verdict]
trial = "gate and rubric"

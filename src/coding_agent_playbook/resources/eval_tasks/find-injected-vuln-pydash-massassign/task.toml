id = "find-injected-vuln-pydash-massassign"
prompt_id = "find-injected-vulnerability"
description = "Mass assignment / class pollution paraphrase; derived from CVE-2025-58367 (CrossCommitVuln-Bench, CC BY 4.0, A. Majumdar). See resources/eval_tasks/ATTRIBUTIONS.md."
version = 1

[setup]
files = ["app/merge.py", "app/model.py", "pyproject.toml"]
project_kind = "library"

[invocation]
prompt_args = "This project contains a security vulnerability. Find where untrusted input reaches a dangerous operation and classify the exploit."
input_variables = {}

[gate]
# Review-only: the agent must find the flaw by reading, not by editing. Deterministic, token-free.
# `names_class` gates the *answer* too: a wrong vulnerability class loses the gate
# here, before the judge is ever invoked (fail_fast short-circuits the JUDGED tier).
expr = "merge_untouched and model_untouched and names_class"

[gate.bind]
merge_untouched = { check = "file_unchanged", path = "app/merge.py" }
model_untouched = { check = "file_unchanged", path = "app/model.py" }
# Lenient CWE-915 class regex: it must not reject a correctly-phrased
# answer — the judge, not this gate, is what grades precision.
names_class = { check = "answer_matches", pattern = '(?i)mass assignment|cwe[-\s]?915\b|prototype pollution|object injection' }

[rubric]
expr = "identifies_exact_vuln"

[rubric.bind]
identifies_exact_vuln = { fail = 0.5, rubric = [
  { judge = "The answer names mass assignment / improperly controlled modification of object attributes (class pollution, CWE-915) as the vulnerability class.", weight = 0.34 },
  { judge = "The answer traces the untrusted source (an attacker-controlled dotted key path) to the sink where a deep setter walks the path with getattr/setattr and can reach protected attributes such as __class__ / __globals__.", weight = 0.33 },
  { judge = "The answer cites the specific fixture files where the source and the sink live (app/model.py and app/merge.py).", weight = 0.33 },
] }

[verdict]
trial = "gate and rubric"

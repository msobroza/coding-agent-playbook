id = "find-injected-vuln-changedetection-ssrf"
prompt_id = "find-injected-vulnerability"
description = "Server-side request forgery paraphrase; derived from CVE-2026-27696 (CrossCommitVuln-Bench, CC BY 4.0, A. Majumdar). See resources/eval_tasks/ATTRIBUTIONS.md."
version = 1

[setup]
files = ["app/fetch.py", "app/watch.py", "pyproject.toml"]
project_kind = "library"

[invocation]
prompt_args = "This project contains a security vulnerability. Find where untrusted input reaches a dangerous operation and classify the exploit."
input_variables = {}

[gate]
# Review-only: the agent must find the flaw by reading, not by editing. Deterministic, token-free.
expr = "fetch_untouched and watch_untouched"

[gate.bind]
fetch_untouched = { check = "file_unchanged", path = "app/fetch.py" }
watch_untouched = { check = "file_unchanged", path = "app/watch.py" }

[rubric]
expr = "identifies_exact_vuln"

[rubric.bind]
identifies_exact_vuln = { fail = 0.5, rubric = [
  { judge = "The answer names server-side request forgery (SSRF, CWE-918) as the vulnerability class.", weight = 0.34 },
  { judge = "The answer traces the untrusted source (a user-supplied watch URL) to the sink where the server issues an HTTP request to that URL with no hostname or IP allowlist.", weight = 0.33 },
  { judge = "The answer cites the specific fixture files where the source and the sink live (app/watch.py and app/fetch.py).", weight = 0.33 },
] }

[verdict]
trial = "gate and rubric"

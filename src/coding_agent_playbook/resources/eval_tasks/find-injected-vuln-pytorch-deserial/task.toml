id = "find-injected-vuln-pytorch-deserial"
prompt_id = "find-injected-vulnerability"
description = "Unsafe deserialization paraphrase; derived from CVE-2025-32434 (CrossCommitVuln-Bench, CC BY 4.0, A. Majumdar). See resources/eval_tasks/ATTRIBUTIONS.md."
version = 1

[setup]
files = ["app/loader.py", "app/registry.py", "pyproject.toml"]
project_kind = "library"

[invocation]
prompt_args = "This project contains a security vulnerability. Find where untrusted input reaches a dangerous operation and classify the exploit."
input_variables = {}

[gate]
# Review-only: the agent must find the flaw by reading, not by editing. Deterministic, token-free.
expr = "loader_untouched and registry_untouched"

[gate.bind]
loader_untouched   = { check = "file_unchanged", path = "app/loader.py" }
registry_untouched = { check = "file_unchanged", path = "app/registry.py" }

[rubric]
expr = "identifies_exact_vuln"

[rubric.bind]
identifies_exact_vuln = { fail = 0.5, rubric = [
  { judge = "The answer names unsafe deserialization (CWE-502) as the vulnerability class.", weight = 0.34 },
  { judge = "The answer traces the untrusted source (an attacker-supplied checkpoint file path) to the sink where its bytes are deserialized with pickle.load (no weights-only / safe-unpickler guard), executing embedded objects.", weight = 0.33 },
  { judge = "The answer cites the specific fixture files where the source and the sink live (app/registry.py and app/loader.py).", weight = 0.33 },
] }

[verdict]
trial = "gate and rubric"

id = "generate-tests-edge-cases"
prompt_id = "generate-tests"
description = "Generate tests for a function with multiple branches, covering each branch and boundary."
version = 1

[setup]
files = ["src/quotient.py"]
project_kind = "python-application"
python_version = "3.12"
frameworks = ["pytest"]

[invocation]
prompt_args = "for the quotient function in src/quotient.py — make sure every branch is covered"
input_variables = { target = "src/quotient.py::quotient" }

[expected]
files_created = ["tests/test_quotient.py"]
files_must_contain = [
  { path = "tests/test_quotient.py", pattern = "def test_quotient" },
  { path = "tests/test_quotient.py", pattern = "parametrize" },
  { path = "tests/test_quotient.py", pattern = "ZeroDivisionError" },
]
files_unchanged = ["src/quotient.py"]
files_forbidden = ["src/quotient_fixed.py"]

[rubric]
criteria = [
  "Each branch of `quotient` (positive, negative, zero divisor, non-integer input) is exercised by at least one test",
  "Boundary inputs (zero numerator, very large values) are included",
  "The zero-divisor case asserts the expected exception type, not just that an exception was raised",
  "Tests are organised with parametrize where the cases share a shape",
]
weights = [0.4, 0.2, 0.2, 0.2]

id = "find-injected-vuln-authlib-sigbypass"
prompt_id = "find-injected-vulnerability"
description = "Signature verification bypass paraphrase; derived from CVE-2026-27962 (CrossCommitVuln-Bench, CC BY 4.0, A. Majumdar). See eval_tasks/ATTRIBUTIONS.md."
version = 1

[setup]
files = ["app/jwt_verify.py", "app/auth.py", "pyproject.toml"]
project_kind = "library"

[invocation]
prompt_args = "This project contains a security vulnerability. Find where untrusted input reaches a dangerous operation and classify the exploit."
input_variables = {}

[gate]
# Review-only: the agent must find the flaw by reading, not by editing. Deterministic, token-free.
# `names_class` gates the *answer* too: a wrong vulnerability class loses the gate
# here, before the judge is ever invoked (fail_fast short-circuits the JUDGED tier).
expr = "jwt_verify_untouched and auth_untouched and names_class"

[gate.bind]
jwt_verify_untouched = { check = "file_unchanged", path = "app/jwt_verify.py" }
auth_untouched       = { check = "file_unchanged", path = "app/auth.py" }
# Lenient CWE-347 class regex: it must not reject a correctly-phrased
# answer — the judge, not this gate, is what grades precision.
names_class = { check = "answer_matches", pattern = '(?i)signature|cwe[-\s]?347\b|alg\s*=\s*none|improper.{0,20}verification' }

[rubric]
expr = "identifies_exact_vuln"

[rubric.bind]
identifies_exact_vuln = { fail = 0.5, rubric = [
  { judge = "The answer names improper signature verification / signature bypass (CWE-347) as the vulnerability class.", weight = 0.34 },
  { judge = "The answer traces the untrusted source (an attacker-supplied token whose header declares alg='none') to the sink where verification returns the decoded payload as trusted without checking any signature.", weight = 0.33 },
  { judge = "The answer cites the specific fixture files where the source and the sink live (app/auth.py and app/jwt_verify.py).", weight = 0.33 },
] }

[verdict]
trial = "gate and rubric"

id = "make-testable/inject-clock"
description = "Edit task: a reminder job reads datetime.now() and builds a live SmsGateway inside its business function; the agent extracts the due-window decision into a pure function, injects the clock and a Protocol- or Callable-typed sender wired in the CLI composition root, and adds named fakes while the characterization tests stay unchanged."
edition = "v0.1.0"

[setup]
files = [
  "clinic/__init__.py",
  "clinic/sms.py",
  "clinic/reminders.py",
  "clinic/cli.py",
  "tests/__init__.py",
  "tests/test_reminders.py",
]
project_kind = "python-application"

[invocation]
prompt_args = "make send_due_reminders in clinic/reminders.py testable"
input_variables = { target = "clinic/reminders.py::send_due_reminders" }

[gate]
# The business module must stop reading the wall clock and stop importing the
# gateway, expose a typed seam, leave construction to the CLI composition root,
# and keep the whole suite green. The clock pattern skips docstrings and #
# comments, so prose naming the production wiring never fails a correct
# refactor. `not file_contains` passes on a missing file, so reminders.py must exist.
expr = "reminders_exists and not reads_clock and not imports_gateway and has_seam and root_builds_gateway and tests_unchanged and suite_green"

[gate.bind]
reminders_exists    = { check = "file_exists", path = "clinic/reminders.py" }
# Called or not: a module-level `_now = datetime.now` or a `clock=datetime.now`
# default still hard-wires the real clock.
reads_clock         = { check = "file_contains", path = "clinic/reminders.py", pattern = '\A(?>"""[\s\S]*?"""|#[^\n]*|[\s\S])*?\b(?:datetime\.(?:now|utcnow|today)|time\.time)\b' }
# A module that never imports clinic.sms cannot build the gateway under any alias.
imports_gateway     = { check = "file_contains", path = "clinic/reminders.py", pattern = '(?m)^[ \t]*(?:from[ \t]+(?:clinic)?\.sms[ \t]+import\b|import[ \t]+clinic\.sms\b|from[ \t]+(?:clinic|\.)[ \t]+import[ \t]+(?:\([^)]*|[^\n]*)\bsms\b)' }
has_seam            = { check = "file_contains", path = "clinic/reminders.py", pattern = '(?m)^[ \t]*class[ \t]+\w+\([^)\n]*\bProtocol\b|^[^#\n]*\bCallable\[' }
root_builds_gateway = { check = "file_contains", path = "clinic/cli.py", pattern = '(?m)^[^#\n]*\bSmsGateway\s*\(' }
tests_unchanged     = { check = "file_unchanged", path = "tests/test_reminders.py" }
suite_green         = { check = "tests_pass" }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The decision of which appointments are due is extracted into a pure function that takes the appointments and the current time as arguments and returns the due ones, with no clock read, SMS call or other I/O inside it.", weight = 0.25 },
  { judge = "The SMS sender reaches the business code as a parameter typed by a small Protocol or a role-named Callable alias declared in clinic/reminders.py, and the clock arrives as a parameter (a Callable returning datetime, or the datetime value); no parameter default builds the concrete gateway or supplies the real clock, and no module-level instance replaces them.", weight = 0.25 },
  { judge = "clinic/cli.py is the one place that builds the concrete SmsGateway and passes the real clock, and every caller of the changed function is updated to the new signature.", weight = 0.2 },
  { judge = "New tests replace the sender with a fake (a named fake class for a Protocol, for example FakeSmsSender in tests/fakes.py rather than a new conftest.py, or a recording function or lambda for a Callable) and use a fixed clock to cover the inclusive 24-hour window, the already-reminded skip, and exactly which messages were sent, without patching datetime or module globals.", weight = 0.2 },
  { judge = "Public behavior is preserved (same reminder text, same window, same returned patient list, same send order) with no feature or unrelated change added.", weight = 0.1 },
] }

[verdict]
trial = "gate and rubric"

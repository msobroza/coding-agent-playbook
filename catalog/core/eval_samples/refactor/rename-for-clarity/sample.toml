id = "refactor/rename-for-clarity"
description = "Edge case: ambiguous one-letter variable names hide intent; the refactor renames them without changing logic."
edition = "v0.1.0"

[setup]
files = ["src/billing.py"]
project_kind = "python-application"

[invocation]
prompt_args = "rename the variables in src/billing.py for clarity — keep behavior identical"
input_variables = { target = "src/billing.py::compute_invoice" }

[gate]
expr = "keeps_signature"

[gate.bind]
keeps_signature = { check = "file_contains", path = "src/billing.py", pattern = "def compute_invoice" }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "Every single-letter loop/temp variable (e.g. `x`, `r`, `t`) is renamed to something descriptive", weight = 0.35 },
  { judge = "The function's signature, return type, and behavior are unchanged", weight = 0.35 },
  { judge = "No comments were added to explain a name that should now be self-explanatory", weight = 0.15 },
  { judge = "The diff is small and obviously a rename — not a rewrite", weight = 0.15 },
] }

[verdict]
trial = "gate and rubric"

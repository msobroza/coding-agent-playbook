id = "review-crbug-ftp-active-string"
prompt_id = "review"
description = "Review a change adding an FTP active-mode setting that reads it as a raw value, so the text 'False' from the command line turns active mode on. Paraphrases the bug a reviewer caught in scrapy pull request 3829, from CRBugBench; see eval_samples/ATTRIBUTIONS.md."

[setup]
files = [
  "CHANGE.diff",
  "src/feedstorage.py",
  "src/settings.py",
  "tests/test_feedstorage.py",
]
project_kind = "library"

[invocation]
prompt_args = "review my change in CHANGE.diff (it is already applied to the working tree). It adds a FEED_STORAGE_FTP_ACTIVE setting so feeds can be uploaded in FTP active mode instead of the default passive mode; like every setting, it can be set in the project settings or overridden on the command line."
input_variables = {}

[gate]
# Review-only: the agent must report, not edit. The change carries one real bug
# (see the rubric), so a correct answer from either prompt set ends on request
# changes, never an approving verdict line. Whether the answer names the right bug
# is the judge's call: no bug-specific pattern here, so wording cannot sink a
# correct review. An empty answer has no verdict line.
expr = "storage_untouched and settings_untouched and tests_untouched and blocks and not approves"

[gate.bind]
storage_untouched  = { check = "file_unchanged", path = "src/feedstorage.py" }
settings_untouched = { check = "file_unchanged", path = "src/settings.py" }
tests_untouched    = { check = "file_unchanged", path = "tests/test_feedstorage.py" }
blocks             = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?request changes\W*$' }
approves           = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?approve(?: with comments)?\W*$' }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The review reports that the setting is read as settings['FEED_STORAGE_FTP_ACTIVE'] or False instead of settings.getbool(...): command-line overrides arrive as text, so -s FEED_STORAGE_FTP_ACTIVE=False (or =0) gives the non-empty string 'False', which is truthy and turns active mode on.", weight = 0.6 },
  { judge = "The review treats that bug as blocking (important, not a nit or an open question), cites its file and line in src/feedstorage.py (from_settings), and its verdict is 'request changes'.", weight = 0.2 },
  { judge = "The review does not invent bugs: anything else it raises is a real problem in the code shown, and it does not ask to rewrite code that works.", weight = 0.2 },
] }

[verdict]
trial = "gate and rubric"

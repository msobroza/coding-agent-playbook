id = "review-change-drops-part-of-request"
prompt_id = "review"
description = "Review a diff against the user's two-part request: the --csv option is done well, but the requested --since date filter is missing from the change; the review must say so and request changes."

[setup]
files = [
  "CHANGE.diff",
  "src/report.py",
  "tests/test_report.py",
]
project_kind = "python-application"

[invocation]
prompt_args = "review my change in CHANGE.diff (it is already applied to the working tree). I asked for two things: a --csv option that prints the report as CSV, and a --since YYYY-MM-DD option that leaves out ledger entries dated before that day."
input_variables = {}

[gate]
# Review-only: the agent must report, not edit. The diff adds --csv (correct and
# tested) but no --since option anywhere, though the user's request asks for both.
# A correct answer from either prompt set says, in one block, that --since (or the
# date filter) is missing, and ends on request changes, never an approving
# verdict line: part of the stated intent left undone blocks the merge. An empty
# answer names nothing and has no verdict line.
expr = "report_untouched and tests_untouched and names_missing_since and blocks and not approves"

[gate.bind]
report_untouched    = { check = "file_unchanged", path = "src/report.py" }
tests_untouched     = { check = "file_unchanged", path = "tests/test_report.py" }
# Either order, within one top-level block: a line plus its indented continuation.
names_missing_since = { check = "answer_matches", pattern = '(?i)(?:--since|\bsince\s+(?:option|flag|filter|argument)|date\s+filter)(?:[^\n]|\n(?=[ \t\n]))*?(?:\bmissing|\bunimplemented|n.t\s+(?:been\s+|yet\s+)?(?:implemented|added|done|handled|included|present|there|supported)|n.t\s+(?:in|part\s+of)\s+(?:the|this)\s+(?:diff|change|commit|patch)|\bdo(?:es)?\s*n.t\s+(?:add|implement|include|handle|support)|\bnever\s+(?:added|implemented|wired|handled|parsed)|\bonly\s+(?:adds|implements|delivers|does|handles)\b|\babsent|\bdropped|\bomitted|\bleft\s+(?:out|undone)|\bnowhere|\bno\s+(?:trace|sign|code|handling|implementation|support))|(?:\bmissing|\bunimplemented|n.t\s+(?:been\s+|yet\s+)?(?:implemented|added|done|handled|included|present|there|supported)|n.t\s+(?:in|part\s+of)\s+(?:the|this)\s+(?:diff|change|commit|patch)|\bdo(?:es)?\s*n.t\s+(?:add|implement|include|handle|support)|\bnever\s+(?:added|implemented|wired|handled|parsed)|\bonly\s+(?:adds|implements|delivers|does|handles)\b|\babsent|\bdropped|\bomitted|\bleft\s+(?:out|undone)|\bnowhere|\bno\s+(?:trace|sign|code|handling|implementation|support))(?:[^\n]|\n(?=[ \t\n]))*?(?:--since|\bsince\s+(?:option|flag|filter|argument)|date\s+filter)|\bno\W+(?:--since|\bsince\s+(?:option|flag|filter|argument)|date\s+filter)' }
blocks              = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?request changes\W*$' }
approves            = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?approve(?: with comments)?\W*$' }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The review reports that the change leaves out the requested --since YYYY-MM-DD option: no argument is added and no ledger entry is filtered by date, so half of the user's request is undone.", weight = 0.45 },
  { judge = "The review treats the missing --since option as blocking and its verdict is 'request changes'.", weight = 0.25 },
  { judge = "The review does not invent bugs in the --csv part (format_csv and its tests are correct).", weight = 0.2 },
  { judge = "The review cites file and line (for example the argument parser in src/report.py's main) and proposes no edits of its own to the files.", weight = 0.1 },
] }

[verdict]
trial = "gate and rubric"

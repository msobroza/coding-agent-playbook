id = "review/style-only-no-changes-needed"
description = "Regression target: code is correct and idiomatic; the review must NOT invent problems or rewrite working code."

[setup]
files = ["src/temperature.py"]
project_kind = "python-application"

[invocation]
prompt_args = "review src/temperature.py — be honest if there's nothing to change"
input_variables = {}

[gate]
# Review-only: the agent must report, not edit. The file is correct, so a correct
# answer from either prompt set ends on an approving verdict line, never a
# request-changes one, and (in the v2 count line) counts no important finding.
# An empty answer has no verdict line: the rubric alone once passed one at 0.6,
# because three of its criteria only ask that nothing be claimed.
expr = "untouched and approves and not blocks and not counts_important"

[gate.bind]
untouched        = { check = "file_unchanged", path = "src/temperature.py" }
approves         = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?approve(?: with comments)?\W*$' }
blocks           = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?request changes\W*$' }
counts_important = { check = "answer_matches", pattern = '(?i)\bfindings\W*[1-9]\d*\s+important\b' }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The review's verdict is 'approve' (with no comments) or 'approve with comments' (style-only, framed as suggestions)", weight = 0.4 },
  { judge = "No correctness, security, or failure-mode bugs are claimed — because none exist", weight = 0.3 },
  { judge = "Any suggestions are framed as preferences, not as required changes", weight = 0.15 },
  { judge = "The review does not propose to rewrite the function or change its signature", weight = 0.15 },
] }

[verdict]
trial = "gate and rubric"

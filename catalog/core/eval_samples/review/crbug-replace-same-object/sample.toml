id = "review/crbug-replace-same-object"
description = "Review a change that removes duplicate references in Scene.replace but loses the object when it replaces an object with itself. Paraphrases the bug a reviewer caught in manim pull request 4242, from CRBugBench; see eval_samples/ATTRIBUTIONS.md."
edition = "v0.1.0"

[setup]
files = [
  "CHANGE.diff",
  "src/scene.py",
  "tests/test_scene.py",
]
project_kind = "library"

[invocation]
prompt_args = "review my change in CHANGE.diff (it is already applied to the working tree). It fixes duplicate references in Scene.mobjects when replace() is asked to put an object that is already on screen in place of another one, as a transform onto an existing object does."
input_variables = {}

[gate]
# Review-only: the agent must report, not edit. The change carries one real bug
# (see the rubric), so a correct answer from either prompt set ends on request
# changes, never an approving verdict line. Whether the answer names the right bug
# is the judge's call: no bug-specific pattern here, so wording cannot sink a
# correct review. An empty answer has no verdict line.
expr = "scene_untouched and tests_untouched and blocks and not approves"

[gate.bind]
scene_untouched = { check = "file_unchanged", path = "src/scene.py" }
tests_untouched = { check = "file_unchanged", path = "tests/test_scene.py" }
blocks          = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?request changes\W*$' }
approves        = { check = "answer_matches", pattern = '(?im)^\W*(?:verdict\W*)?approve(?: with comments)?\W*$' }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The review reports the edge case where new_mobject is old_mobject: the new deduplication removes the object from the list before searching, so scene.replace(a, a) no longer finds a, raises ValueError and leaves a removed from the scene; the deduplication must skip the case new_m is old_m (or run only after the replacement).", weight = 0.6 },
  { judge = "The review treats that bug as blocking (important, not a nit or an open question), cites its file and line in src/scene.py (the deduplication at the top of replace_in_list), and its verdict is 'request changes'.", weight = 0.2 },
  { judge = "The review does not invent bugs: anything else it raises is a real problem in the code shown, and it does not ask to rewrite code that works.", weight = 0.2 },
] }

[verdict]
trial = "gate and rubric"

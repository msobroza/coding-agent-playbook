id = "security-review-pickle-load"
prompt_id = "security-review"
description = "Happy path: a model loader unpickles untrusted artifacts (pickle.load of a registry file, pickle.loads of a queue payload); a good security review flags the RCE and proposes a pickle-free refactor."
version = 1

[setup]
files = ["src/unsafe_model_loader.py"]
project_kind = "ml-research"
ml_stack = ["torch", "scikit-learn"]

[invocation]
prompt_args = "security review src/unsafe_model_loader.py"
input_variables = {}

[gate]
expr = "untouched"

[gate.bind]
untouched = { check = "file_unchanged", path = "src/unsafe_model_loader.py" }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "The review flags `pickle.load` of a model artifact the codebase did not produce as arbitrary code execution (not merely a style nit)", weight = 0.35 },
  { judge = "The review also flags `pickle.loads` of the message-queue payload — both untrusted-deserialization sites are caught", weight = 0.3 },
  { judge = "Unsafe-deserialization findings are reported BEFORE lower-priority concerns — priority order is respected", weight = 0.15 },
  { judge = "Each finding proposes a concrete safe refactor (pickle-free format such as JSON/safetensors, or verified provenance) rather than a vague warning", weight = 0.2 },
] }

[verdict]
trial = "gate and rubric"

id = "generate-tests/edge-cases"
description = "Generate tests for a function with multiple branches, covering each branch and boundary."

[setup]
files = ["src/quotient.py"]
project_kind = "python-application"

[invocation]
prompt_args = "for the quotient function in src/quotient.py — make sure every branch is covered"
input_variables = { target = "src/quotient.py::quotient" }

[gate]
# The prompt never names the tests, so the gate asks for a test function, not
# for one called test_quotient*: that literal failed every run of two models
# (v0.2.0 and v0.4.0 release metrics) whose tests were named by branch instead.
expr = "test_created and defines_tests and parametrized and raises_zerodiv and src_unchanged and no_fixed_copy"

[gate.bind]
test_created = { check = "file_exists", path = "tests/test_quotient.py" }
defines_tests = { check = "file_contains", path = "tests/test_quotient.py", pattern = '(?m)^\s*(async\s+)?def test_' }
parametrized = { check = "file_contains", path = "tests/test_quotient.py", pattern = "parametrize" }
raises_zerodiv = { check = "file_contains", path = "tests/test_quotient.py", pattern = "ZeroDivisionError" }
src_unchanged = { check = "file_unchanged", path = "src/quotient.py" }
no_fixed_copy = { check = "file_forbidden", path = "src/quotient_fixed.py" }

[rubric]
expr = "quality"

[rubric.bind]
quality = { fail = 0.5, rubric = [
  { judge = "Each branch of `quotient` (positive, negative, zero divisor, non-integer input) is exercised by at least one test", weight = 0.4 },
  { judge = "Boundary inputs (zero numerator, very large values) are included", weight = 0.2 },
  { judge = "The zero-divisor case asserts the expected exception type, not just that an exception was raised", weight = 0.2 },
  { judge = "Tests are organised with parametrize where the cases share a shape", weight = 0.2 },
] }

[verdict]
trial = "gate and rubric"

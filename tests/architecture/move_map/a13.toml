# A13 (#126, specs/prT-package-layout.md 5.2.2, 7.6): the hook-pack tests leave
# tests/hooks/ for the pack directories under tests/hook_runtime/handlers/, so that
# tests/hooks/ belongs to the sync-time hooks/ package (H19). Module entries, not
# [[path]] ones: other test trees import pack_repo, stop_kit and ruff_kit, and each
# module entry also derives the file's path entry for the docs.

# The directory itself, for the docs that name tests/hooks/. A [[path]] entry, not a
# package [[module]] one: GC-2 and A17 put the sync-time hooks/ tests back under the
# tests.hooks package, and those module names must never resolve to handlers/.
[[path]]
pr = "A13"
old = "tests/hooks/"
new = "tests/hook_runtime/handlers/"

[[module]]
pr = "A13"
old = "tests.hooks.conftest"
new = "tests.hook_runtime.handlers.conftest"


# A15 (#129, specs/prT-package-layout.md 4.24, 7.6): the verify and audit packs leave
# the flat hook_runtime/handlers/ for handlers/verify/ and handlers/audit/, each handler
# module named after its snake-cased hook id (the registry names, hook ids and stage
# names never change). The two transcript and public-API readers only the verify pack
# imports leave hook_runtime/ for handlers/verify/. gate-weakening-guard keeps two
# modules, because its pre-edit companion is on the dispatch hot path.

# The audit pack: 2 private helpers keep their names, 3 handlers take their hook ids.


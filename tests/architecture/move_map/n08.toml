# N8 (#90, specs/prT-package-layout.md 4.3, 7.4): the guard twins move into commands/twins/.
# _git_base.py becomes twins/_git_scope.py with the range half of gate_scan.py, so no twin
# imports the gate-scan command as a library; _twin_policy.py and _ci_policy.py are
# concatenated into the public twins/policy.py (init imports it).


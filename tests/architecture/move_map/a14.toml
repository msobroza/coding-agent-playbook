# A14 (#128, specs/prT-package-layout.md 4.24, 7.6): the safety pack leaves the flat
# hook_runtime/handlers/ for handlers/safety/, each handler module named after its
# snake-cased hook id (the registry names, hook ids and stage names never change),
# and the helpers more than one pack imports go to handlers/_shared/, which is private
# to handlers, so its modules drop the underscore. The two control-plane helpers
# only the protect pack imports since GC-1 (the TOML and text verdicts) are not
# shared helpers any more and wait for A16's protect/ split.

# The safety pack: 11 private helpers keep their names, 13 handlers take their hook ids.


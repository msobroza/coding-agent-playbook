# A3 (#116, specs/prT-package-layout.md 4.12, 7.6): skill composition leaves the
# package root for skills/, and the Agent Skills naming rules leave adapters/ for the
# public skills/naming.py, which ends the skills -> adapters private import. The
# re-export ladder of adapters/_skill_writer.py is removed (L2, H22): importers name
# the defining module. _skill_writer keeps skill_id_of as a plain import (it calls
# it), so the script treats that one name as current there; A3 rewrites its
# importers by hand.

[[module]]
pr = "A3"
old = "coding_agent_playbook.skill_document"
new = "coding_agent_playbook.skills.document"

[[module]]
pr = "A3"
old = "coding_agent_playbook.skill_membership"
new = "coding_agent_playbook.skills.membership"

[[module]]

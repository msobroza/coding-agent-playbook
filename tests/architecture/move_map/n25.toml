# N25 (#105, specs/prT-package-layout.md 4.18, 7.4): evaluators/ is renamed grading/
# (L6, CONTEXT Grading kernel). builtins/ becomes static_metrics/, execution/ becomes
# execution_metrics/, and the kernel's checks/ is flattened into grading/ (registry.py
# as check_registry.py, execution.py as execution_checks.py). Every package __init__.py
# is a docstring only, so the package re-exports go (L2, L5).

[[module]]
pr = "N25"
old = "coding_agent_playbook.evaluators"
new = "coding_agent_playbook.grading"
package = true

[[module]]
pr = "N25"
old = "coding_agent_playbook.evaluators.builtins"
new = "coding_agent_playbook.grading.static_metrics"
package = true

[[module]]
pr = "N25"
old = "coding_agent_playbook.evaluators.execution"
new = "coding_agent_playbook.grading.execution_metrics"
package = true

[[module]]
pr = "N25"
old = "coding_agent_playbook.evaluators.checks.compose"
new = "coding_agent_playbook.grading.compose"

[[module]]
pr = "N25"

# A17 (#131, specs/prT-package-layout.md 4.11, 7.6): the sync-time hook policy
# package becomes the hooks/ package: resolution/ (the layer merge and the effective
# view), contract/ (the validate trust contract, its private findings module made
# public), enforcement.py (the adapter labels and the advisory projection,
# concatenated) and guardrails_skill.py.

# The package itself: a submodule no entry below names follows by prefix, and the
# docs that name the directory follow the derived path.
[[module]]
pr = "A17"
old = "coding_agent_playbook.hook_policy"
new = "coding_agent_playbook.hooks"
package = true


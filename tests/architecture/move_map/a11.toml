# A11 (#124, specs/prT-package-layout.md 7.6): the rest of the dispatcher joins
# hook_runtime/dispatch/. The pipeline helpers stay private; the six underscore
# modules imported from outside dispatch/ (selection, prefilter, tail, ports,
# external, event_memo) become public package members; combine, watchdog,
# routing, registry, escape, deps and proc keep their names.


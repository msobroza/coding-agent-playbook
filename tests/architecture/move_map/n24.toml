# N24 (#104, specs/prT-package-layout.md 4.7, 7.4): the eval-only check families
# (they read ctx.tree, ctx.artifact or ctx.trials) leave the grading kernel for
# evals/checks/, and the named gate and rubric registries move beside the task
# compiler, their only consumer. Both registries keep their entry-point groups (L2).


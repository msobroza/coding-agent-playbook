# GC-2 (#135, specs/prT-package-layout.md 9 AC.2.5, 7.6): the guard_config.json writer
# leaves the root for the hooks/guard_config/ package: compile (the document), inputs
# (the request's value types), resource_roots, ruff_probe (the machine-local probe) and
# the private _tables_* builders. Its two adapter-dependent parts move up to the sync
# side, because hooks sits below adapters (GC-D1): the hook-script copies to
# sync/_hook_scripts.py, the protected-set assembly to sync/_protect.py. The writer's
# facade re-exports are removed (L2): importers name the defining module.

[[module]]
pr = "GC-2"
old = "coding_agent_playbook.guard_config"
new = "coding_agent_playbook.hooks.guard_config.compile"


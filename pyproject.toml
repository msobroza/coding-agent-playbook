    "coding_agent_playbook.release",
    "coding_agent_playbook.rendering",
    "coding_agent_playbook.skills",
    "coding_agent_playbook.sync",
    "coding_agent_playbook.toml_writer",
    "coding_agent_playbook.validation",
    "jinja2",
    "packaging",
    "yaml",
]
broken_contract_guidance = """
The grading kernel is shared by eval samples and the metrics gate, so it imports neither, nor
the hook runtime: only the stdlib, itself and STDLIB_LEAVES (tests/engine_modules.py).
"""

[[tool.importlinter.contracts]]
id = "command-independence"
name = "No command imports another command"
type = "independence"
# Every public module of commands/ and commands/twins/ but the shared twins.policy
# (test_command_independence_lists_every_command).
modules = [
    "coding_agent_playbook.commands.check",
    "coding_agent_playbook.commands.eval",
    "coding_agent_playbook.commands.forge",
    "coding_agent_playbook.commands.import_harness",
    "coding_agent_playbook.commands.init",
    "coding_agent_playbook.commands.metrics",
    "coding_agent_playbook.commands.render",
    "coding_agent_playbook.commands.sync",
    "coding_agent_playbook.commands.twins.check_commit_trailers",
    "coding_agent_playbook.commands.twins.check_deps",
    "coding_agent_playbook.commands.twins.check_notebooks",
    "coding_agent_playbook.commands.twins.ci",
    "coding_agent_playbook.commands.twins.docs_check",
    "coding_agent_playbook.commands.twins.gate_scan",
    "coding_agent_playbook.commands.twins.scan_secrets",
    "coding_agent_playbook.commands.twins.scan_sinks",
    "coding_agent_playbook.commands.validate",
    "coding_agent_playbook.commands.validate_harness",
]
broken_contract_guidance = """
Shared code goes below commands (a domain package) or into a commands/_helper module that
imports no command.
"""

[[tool.importlinter.contracts]]
id = "private-modules"
name = "An underscore module is imported only from inside its own package"
type = "private_modules"
containers = ["coding_agent_playbook"]
ignore_imports = []
broken_contract_guidance = """
Import a public module of the owning package, or move the importer inside that package.
"""

[[tool.importlinter.contracts]]
id = "twins-use-judges"
name = "A guard twin reaches a guard's judge through hook_runtime.judges, never a handler"
type = "forbidden"
source_modules = ["coding_agent_playbook.commands.twins"]
forbidden_modules = ["coding_agent_playbook.hook_runtime.handlers"]
# Direct imports only: the contract checks the twin-to-handler imports, and the
# layer and private-modules contracts cover the chains through modules outside
# commands.twins (specs/prT-package-layout.md B.9.2).
allow_indirect_imports = "true"
broken_contract_guidance = """
A twin runs the same judge as its guard hook: import it from hook_runtime.judges, and
move a judge a handler still holds there first (CONTEXT: Guard twin).
"""

# --- coverage ---

# sys.monitoring (PEP 669) instead of the default C tracer: the tracer made the
# sync-heavy CLI tests about 2.5x slower, while sysmon gave the same line coverage
# (an identical TOTAL on tests/unit plus tests/cli/test_sync_check.py) at near
# no-coverage speed. It needs Python 3.12+, which requires-python already demands.
[tool.coverage.run]
core = "sysmon"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

# --- commitizen (the commit convention and the release version; prK §K OQ-6, ADR 0012) ---
# Two consumers read this table, both with commitizen>=4.13,<5 (COMMITIZEN_REQUIREMENT
# in scripts/release.py; the playbook-ci job installs the same range):
# - `cz check`, in the playbook-ci job's `commit-convention` step of `playbook ci`
#   (history before .coding-agent-playbook.toml's cutover_date is skipped), plus the
#   PR title.
# - scripts/release.py prepare, which asks `cz bump --get-next --yes [--increment
#   MINOR]` for the next version and writes it with `cz bump <version>
#   --version-files-only --yes`, then commits "chore(release): v<version>" itself.
#   It never runs a bare `cz bump`: that tags the release-branch commit, which the
#   squash merge discards. CI tags the merged release commit instead.
# cz finds the previous release by the tag named after the CURRENT [project] version,
# so release.py refuses to prepare while that tag is missing (merged but not tagged).
# [project] version stays the only version source (pep621 reads and writes it in
# place; hatch builds from it), so there is no `version` key and no version_files.
# No changelog keys: the per-release notes under catalog/releases/ are the only
# changelog (ADR 0012), so there is no CHANGELOG.md.
# commitizen is not a dev extra: the test suite fakes it.

[tool.commitizen]
# The stock rules: cz_customize without a copied schema_pattern makes `cz check`
# accept any message.
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
# While 0.x, `!` and BREAKING CHANGE bump the minor, so the notes mark breaking pull
# requests. cz keeps applying this key after 1.0: delete it in the release PR that
# goes to 1.0.0.
major_version_zero = true
bump_message = "chore(release): v$new_version"

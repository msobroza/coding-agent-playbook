# pyproject.toml — coding-agent-playbook engine, PR 1 (scaffolding)
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-playbook"
version = "0.1.0a0"
description = "Multi-harness playbook engine — one canonical source, every coding assistant."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Max Pereira" }]
requires-python = ">=3.12"
keywords = ["llm", "coding-assistant", "continue", "claude-code", "opencode", "agents-md"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    # 3.1.6 closes the published sandbox escapes the engine relies on the sandbox
    # to block (CVE-2024-56326 fixed in 3.1.5, CVE-2025-27516 in 3.1.6); SPEC §9.3.
    "jinja2>=3.1.6",
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional code-quality extra (PR M): radon backs the maintainability_index
# evaluator. Never a hard dep — imported lazily; the engine + static gate run
# without it (the evaluator reports unavailable and is skipped).
metrics = ["radon>=6.0"]
dev = [
    # Pinned: an unpinned ruff that began formatting the code blocks inside
    # markdown has turned CI red before, with no change in this repository.
    "ruff==0.17.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "types-pyyaml>=6.0",
    # Pinned like ruff: the contracts in [tool.importlinter] run from pytest
    # (tests/architecture/test_import_contracts.py), so a release that changes a
    # contract type's semantics must not change the CI verdict on its own.
    "import-linter==2.15",
]

[project.scripts]
playbook = "coding_agent_playbook.cli:main"
coding-agent-playbook = "coding_agent_playbook.cli:main"
# The human entry of the hook runtime (simulate, doctor, --version). Harnesses never
# use it: they run "<pin> -I -m coding_agent_playbook.hook_runtime" (prK §D.1).
playbook-hook = "coding_agent_playbook.hook_runtime.cli:main"

# --- Extension-point tables. PR 1 declares them empty; future PRs populate. ---

[project.entry-points."coding_agent_playbook.adapters"]
# Populated by PRs 6–9: continue, claude_code, opencode, agents_md.
agent_harness = "coding_agent_playbook.adapters.agent_harness_adapter:AgentHarnessAdapter"
agents_md = "coding_agent_playbook.adapters.agents_md:AgentsMdAdapter"
claude_code = "coding_agent_playbook.adapters.claude_code.adapter:ClaudeCodeAdapter"
continue = "coding_agent_playbook.adapters.continue_:ContinueAdapter"
opencode = "coding_agent_playbook.adapters.opencode:OpenCodeAdapter"
shared_skills = "coding_agent_playbook.adapters.shared_skills:SharedSkillsAdapter"

[project.entry-points."coding_agent_playbook.overlays"]
# Populated by overlay packages (e.g. playbook-rules-bnp). Engine ships none.

[project.entry-points."coding_agent_playbook.artifact_sources"]
filesystem = "coding_agent_playbook.catalog.source:FileSystemArtifactSource"

[project.entry-points."coding_agent_playbook.state_sources"]
filesystem = "coding_agent_playbook.config.files:FileSystemStateSource"

[project.entry-points."coding_agent_playbook.runners"]
# The hermetic FakeRunner ships in v1.1 (PR R1); ClaudeCodeRunner lands in R1c
# and OpenCodeRunner in R3 Track O (opt-in real runners, never exercised in CI).
fake = "coding_agent_playbook.evals.fake_runner:FakeRunner"
claude_code = "coding_agent_playbook.evals.claude_code_runner:ClaudeCodeRunner"
opencode = "coding_agent_playbook.evals.opencode_runner:OpenCodeRunner"

[project.entry-points."coding_agent_playbook.judges"]
# PR R2 — the opt-in LLMJudge shells out to the `claude` CLI (available()-gated,
# never exercised in CI). Omitting `--judge` means deterministic-only (no judge).
llm = "coding_agent_playbook.evals.judge:LLMJudge"

[project.entry-points."coding_agent_playbook.metrics"]
# Out-of-tree code-quality Metrics. Engine builtins self-register via the
# @register_metric decorator; this group is the third-party extension point
# (the engine ships none in it). In-tree builtins win on a name clash.

[project.entry-points."coding_agent_playbook.checks"]
# Out-of-tree custom grader Checks (Metric -> Check -> Rubric stack). The engine
# ships none in it; this group is the third-party extension point for new
# grading strategies beyond the built-in threshold/regression/file/judge checks.

[project.entry-points."coding_agent_playbook.rubrics"]
# Out-of-tree named rubrics; reference from task.toml via [rubric] ref = …. A
# code-defined Rubric subclass (declaring its CRITERIA) registers here so eval
# tasks can share one rubric by name. The engine ships none; in-tree
# registrations win on a name clash.

[project.entry-points."coding_agent_playbook.gates"]
# Out-of-tree composed gates; reference from a task's [gate.bind] via ref = …. A
# code-defined factory returning a composed boolean Check (AllOf/AnyOf/Not over
# file/threshold/judge checks) registers here so eval tasks can share one gate by
# name. The engine ships none; in-tree registrations win on a name clash.

[project.entry-points."coding_agent_playbook.hook_handlers"]
# Out-of-tree lifecycle-hook handlers (specs/prK-lifecycle-hooks.md §D.1, P-D5).
# The engine's own handlers are builtins and ship none here. Entries are resolved
# at `playbook sync`, never scanned by the hook runtime, and run only when their
# package is in allow_code_from. The `playbook-hook` script lands with its module.

# ----------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_playbook"]

[tool.hatch.build.targets.wheel.force-include]
"src/coding_agent_playbook/py.typed" = "coding_agent_playbook/py.typed"
"catalog" = "coding_agent_playbook/_catalog"

# --- Ruff (lint + format) ---

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# A vendored opt-in pack (SPEC §11.5: superpowers) ships upstream text that must
# stay byte-faithful to its source, so ruff never lints or reformats any of its
# files. The distilled python_design pack (SPEC §11.5.2) is our own code:
# its stdlib scripts ARE linted and formatted. Only its markdown is excluded,
# because newer, unpinned ruff versions also reformat code blocks inside
# markdown (CI has gone red on that before), and its fenced examples include
# deliberate "before" code.
# Eval-task fixtures under setup/ are deliberately unclean needle material (the
# find-injected-vuln-* bugs live there), so `ruff check --fix` / `ruff format`
# must never rewrite them either (specs/prK-lifecycle-hooks.md §P9). Eval tasks
# are per layer, so a bundled plugin's fixtures get the same exclude as core's.
# mypy needs none: catalog/ is outside its `files`.
extend-exclude = [
    "catalog/plugins/superpowers",
    "catalog/plugins/python_design/**/*.md",
    "catalog/core/eval_tasks/*/setup",
    "catalog/plugins/*/eval_tasks/*/setup",
]
# Pre-commit and the hook/Stop stages pass file names explicitly, and ruff
# ignores the excludes above for an explicitly passed path unless force-exclude
# is on: the hooks would then rewrite the vendored superpowers markdown and the
# eval-task needle fixtures.
force-exclude = true
# Skill scripts run in consumer repos on Python 3.10+, so pyupgrade must not
# suggest 3.12-only syntax there (PEP 695 aliases/generics).
per-file-target-version = { "catalog/plugins/*/skills/*/scripts/*.py" = "py310" }

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "TCH",      # flake8-type-checking
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

# --- mypy (strict) ---

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# radon is an optional extra (the `metrics` group) and ships no type stubs, so it
# is missing in the default `.[dev]` CI install. Ignore its imports unconditionally
# — clean whether radon is present (untyped) or absent (not found), with no fragile
# inline `# type: ignore` that flips between import-untyped/import-not-found.
[[tool.mypy.overrides]]
module = "radon.*"
ignore_missing_imports = true

# --- pytest ---

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=coding_agent_playbook",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
xfail_strict = true
filterwarnings = ["error"]
markers = ["catalog: checks over the engine catalog under catalog/ (pre-commit catalog-checks hook)"]

# --- import-linter (ADR 0002: the package dependency direction) ---
# Run by tests/architecture/test_import_contracts.py, so the CI gate stays ruff,
# ruff format, mypy and pytest. An ignore_imports line is a known edge, commented
# with the PR that removes it (or, for the stacks, the deferred branch it is); a
# line that no longer matches any import fails the run. The forbidden lists and
# exhaustive_ignores are pinned to the package tree by the same test file. The PR
# ids are those of specs/prT-package-layout.md section 7.

[tool.importlinter]
root_packages = ["coding_agent_playbook"]
# TYPE_CHECKING imports count: an interface that names a higher layer's type
# depends on that layer even when nothing imports it at run time.
exclude_type_checking_imports = false
# The third-party top-level packages join the graph, so the stacks and the leaves can
# forbid the engine's runtime dependencies (jinja2, packaging, yaml) statically.
include_external_packages = true
contract_types = ["private_modules: tests.architecture.private_modules_contract.PrivateModulesContract"]

[[tool.importlinter.contracts]]
id = "engine-layers"
name = "A package imports only packages below it"
type = "layers"
containers = ["coding_agent_playbook"]
# Highest first. A parenthesised layer does not exist yet; the PR that creates the
# package drops the parentheses. hook_runtime is a separate stack, never a layer.
layers = [
    "cli",
    "commands",
    "sync",
    "validation",
    "(agent_harness) | evals | precommit",
    "adapters",
    "(rendering)",
    "hooks",
    "skills",
    "metrics_gate",
    "config",
    "catalog",
    "detector | lockfile",
    "(grading)",
    "generated_output",
    "artifacts",
    "security | toml_writer | (_plugin_registry)",
]
exhaustive = true
# Top-level modules not yet in their target package: each move PR deletes its
# names. hook_runtime stays here for good.
exhaustive_ignores = [
    "_gate_scan_files",
    "_guard_config_allowlists",
    "_guard_config_detect",
    "_guard_config_prompts",
    "_guard_config_protect",
    "_guard_config_quality",
    "_guard_config_ruff",
    "_guard_config_secrets",
    "_guard_config_skills",
    "_guard_config_toolchain",
    "_guard_config_verify",
    "evaluators",
    "gate_scan",
    "git_env",
    "guard_config",
    "harness",
    "hook_registrations",
    "hook_runtime",
    "prompt_rule_delivery",
    "renderer",
    "rule_registry",
]
ignore_imports = [
    # kept: catalog-layers (the artifact source parses eval tasks) is not scheduled (L12)
    "coding_agent_playbook.catalog.source -> coding_agent_playbook.evals.**",
    # kept: catalog-layers (injecting the hook merger from the callers) is not scheduled
    # (L12): OverlayResolver defaults to the layer merge's merge_hook_layers and
    # NO_HANDLER_SCHEMAS (A5 made the edge visible; A17 pointed it at the hooks package)
    "coding_agent_playbook.catalog.resolve -> coding_agent_playbook.hooks.**",
]
broken_contract_guidance = """
A lower layer may not import a higher one, directly or through modules outside the layers.
Move the shared code down, or pass the value in from the caller. A new top-level module
belongs in a layer, or (old layout only) in exhaustive_ignores.
"""


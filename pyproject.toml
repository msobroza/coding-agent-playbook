    "coding_agent_playbook.generated_output.atomic_io",
    "coding_agent_playbook.generated_output.sentinel",
    "coding_agent_playbook.lockfile",
    "coding_agent_playbook.security",
]
# Every top-level module except STDLIB_LEAVES, then the runtime dependencies
# (tests/engine_modules.py; test_leaf_contract_covers_every_stdlib_leaf prints the
# expected list).
forbidden_modules = [

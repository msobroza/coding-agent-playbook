    "coding_agent_playbook.commands.twins.scan_sinks",
    "coding_agent_playbook.commands.validate",
    "coding_agent_playbook.commands.validate_harness",
]
broken_contract_guidance = """
Shared code goes below commands (a domain package) or into a commands/_helper module that
imports no command.
"""

[[tool.importlinter.contracts]]
id = "private-modules"
name = "An underscore module is imported only from inside its own package"
type = "private_modules"
containers = ["coding_agent_playbook"]
ignore_imports = [
    # A7: adapters/_skill_files.py becomes generated_output/source_files.py (after #62)
    "coding_agent_playbook.commands._import_files -> coding_agent_playbook.adapters._skill_files",
    # CP-3: init's configure() owns --adapters (after #62)
    "coding_agent_playbook.cli.parser -> coding_agent_playbook.commands._init_adapters",
    # N15: FIXTURE_GLOBS moves to the stdlib leaf artifacts/path_classes.py
    "coding_agent_playbook.evaluators.paths -> coding_agent_playbook.hook_runtime.handlers._eval_paths",
    "coding_agent_playbook.metrics_gate.config -> coding_agent_playbook.hook_runtime.handlers._eval_paths",
    "coding_agent_playbook.gate_scan -> coding_agent_playbook.hook_runtime.handlers._eval_paths",
    "coding_agent_playbook.guard_config -> coding_agent_playbook.hook_runtime.handlers._eval_paths",
    # A16: hook_runtime/_ruff.py becomes the public hook_runtime/ruff.py (after #62)
    "coding_agent_playbook._guard_config_quality -> coding_agent_playbook.hook_runtime._ruff",
    "coding_agent_playbook._guard_config_ruff -> coding_agent_playbook.hook_runtime._ruff",
    # N17: becomes hook_runtime/shell/wrappers.py
    "coding_agent_playbook.guard_config -> coding_agent_playbook.hook_runtime._shell_wrappers",
    # GC-1: the constants move to hook_runtime/config/schema.py (after #62)
    "coding_agent_playbook.guard_config -> coding_agent_playbook.hook_runtime.handlers._control_plane_paths",
    "coding_agent_playbook.guard_config -> coding_agent_playbook.hook_runtime.handlers._control_plane_text",
    # N14 (R1): the sink judge's lazy regex fallback, visible since the judge left
    # handlers/; A16 moves _sink_regex to handlers/feedback/ (apply renames this
    # line); no scheduled PR removes it: the fallback would have to join judges/
    "coding_agent_playbook.hook_runtime.judges.sink_scan -> coding_agent_playbook.hook_runtime.handlers._sink_regex",
    # N18: becomes hook_runtime/git/parse.py
    "coding_agent_playbook.commands.twins._secret_scope -> coding_agent_playbook.hook_runtime._git_parse",
    "coding_agent_playbook.commands.twins.check_notebooks -> coding_agent_playbook.hook_runtime._git_parse",
    "coding_agent_playbook.commands.twins.scan_sinks -> coding_agent_playbook.hook_runtime._git_parse",
    # N15: the gate judge moves inside hook_runtime, where _git_parse is its own package's
    "coding_agent_playbook.gate_scan -> coding_agent_playbook.hook_runtime._git_parse",
    # N21: becomes hook_runtime/harness/payload.py
    "coding_agent_playbook.hook_runtime.dispatch -> coding_agent_playbook.hook_runtime.harness._payload",
    # A7: becomes generated_output/write_guard.py (after #62)
    "coding_agent_playbook.sync._hook_outputs -> coding_agent_playbook.adapters._owned_files",
    "coding_agent_playbook.sync.pipeline -> coding_agent_playbook.adapters._owned_files",
    # A7: becomes generated_output/source_files.py (after #62)
    "coding_agent_playbook.validation.checks -> coding_agent_playbook.adapters._skill_sources",
    "coding_agent_playbook.guard_config -> coding_agent_playbook.adapters._skill_sources",
]
broken_contract_guidance = """
Import a public module of the owning package, or move the importer inside that package.
"""

[[tool.importlinter.contracts]]
id = "twins-use-judges"
name = "A guard twin reaches a guard's judge through hook_runtime.judges, never a handler"
type = "forbidden"
source_modules = ["coding_agent_playbook.commands.twins"]
forbidden_modules = ["coding_agent_playbook.hook_runtime.handlers"]
# Direct imports only: a twin still reaches handlers through modules outside
# commands.twins. Until N15: gate_scan, metrics_gate.config and evaluators.paths
# import handlers._eval_paths. With no scheduled end: judges.sink_scan lazily imports
# handlers._sink_regex (its regex fallback). The layer and private-modules contracts
# cover those chains (specs/prT-package-layout.md B.9.2).
allow_indirect_imports = "true"
broken_contract_guidance = """
A twin runs the same judge as its guard hook: import it from hook_runtime.judges, and
move a judge a handler still holds there first (CONTEXT: Guard twin).
"""

# --- coverage ---

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

# --- commitizen (the commit-message convention; dogfooded, prK §K OQ-6) ---
# Read by `cz check` in the playbook-ci job, which runs the `commit-convention` step
# of `playbook ci` (the history before .coding-agent-playbook.toml's cutover_date is
# skipped). It sets no version or bump keys, because hatch's [project] version
# stays the only version source. commitizen is not a dev extra: only that CI job
# installs it, so the CI-parity gate is unchanged.

[tool.commitizen]
name = "cz_conventional_commits"

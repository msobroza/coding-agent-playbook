# .pre-commit-config.yaml — engine dev loop.
# Air-gapped-friendly: all hooks are `repo: local` + `language: system`; no
# remote hook repos are cloned. ruff/mypy/pytest come from the `dev` extra
# (`pip install -e ".[dev]"`) and run from PATH. This mirrors what CI runs
# (.github/workflows/ci.yml): ruff formats the code blocks inside markdown as
# well as Python, as CI's `ruff format --check .` does, and `--force-exclude`
# keeps pyproject's extend-exclude (the vendored superpowers markdown) in force
# even though pre-commit passes file names explicitly. The catalog checks (the
# `catalog` pytest marker, CI's skill lane in ADR 0009) run only when a commit
# touches catalog/, spread over the cores with pytest-xdist's `-n auto`. The
# full test suite stays CI's job. Consumer-facing hooks are in
# .pre-commit-hooks.yaml.
default_language_version:
  python: python3.12
fail_fast: false
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true
      - id: mypy
        name: mypy
        entry: mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
      - id: catalog-checks
        name: catalog checks
        entry: pytest -q --no-cov -p no:cacheprovider -n auto -m catalog
        language: system
        files: ^catalog/
        pass_filenames: false

# .pre-commit-config.yaml — engine dev loop.
# Air-gapped-friendly: all hooks are `repo: local` + `language: system`; no
# remote hook repos are cloned. ruff/mypy come from the `dev` extra
# (`pip install -e ".[dev]"`) and run from PATH. This mirrors exactly what CI
# runs (.github/workflows/ci.yml). Consumer-facing hooks are in
# .pre-commit-hooks.yaml.
default_language_version:
  python: python3.12
fail_fast: false
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
